services:
  backend:
    container_name: tcg-backend-local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8080"
    environment:
      MODEL_NAME: ${MODEL_NAME:-gemini-3.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-test-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-true}
      EXECUTION_ARTIFACT_ROOT: ${EXECUTION_ARTIFACT_ROOT:-/app/.execution_artifacts}
      EXECUTION_DEFAULT_BASE_URL: ${EXECUTION_DEFAULT_BASE_URL:-http://frontend:8080}
      EXECUTION_PLAYWRIGHT_CONFIG: ${EXECUTION_PLAYWRIGHT_CONFIG:-/app/backend/execution_runtime/playwright.config.ts}
      EXECUTION_RUNTIME_CWD: ${EXECUTION_RUNTIME_CWD:-/app/backend/execution_runtime}
      EXECUTION_MAX_CASES_PER_REQUEST: ${EXECUTION_MAX_CASES_PER_REQUEST:-20}

  frontend:
    container_name: tcg-frontend-local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "5173:8080"
    depends_on:
      - backend
