name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend tests and offline benchmarks
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-dummy-gemini-key
      MODEL_NAME: gemini-3-flash-preview
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-with-enough-length
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      FIREBASE_PROJECT_ID: ci-firebase-project
      BILLING_SHADOW_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check backend scripts

      - name: Check backend formatting
        run: python -m ruff format --check backend scripts

      - name: Run backend unittest suite
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Evaluate requirements offline
        run: python scripts/evaluate_requirements.py --offline --strict

      - name: Evaluate generation offline
        run: python scripts/evaluate_generation.py --offline --strict

      - name: Evaluate orchestrator offline
        run: python scripts/evaluate_orchestrator.py --offline --strict

      - name: Validate OpenAPI contract export
        run: python scripts/export_openapi.py --output /tmp/agentic-tcg-openapi.json --indent 0

      - name: Check frontend API contract types
        run: python scripts/generate_frontend_api_types.py --check

  frontend:
    name: Frontend build and focused E2E
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-with-enough-length
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      VITE_API_BASE: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run focused mocked E2E
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/tcg-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID' EXIT
          node -e "const http=require('http');let attempts=0;const check=()=>http.get('http://127.0.0.1:5173',res=>{res.resume();process.exit(0)}).on('error',()=>{if(++attempts>60)process.exit(1);setTimeout(check,1000)});check();"
          E2E_BASE_URL=http://127.0.0.1:5173 npm run test:e2e -- e2e/export-approval-gate.spec.js
